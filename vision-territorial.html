<!DOCTYPE html>
<!-- URBIS · Visión Territorial — la cuarta puerta.
     Página PROPIA, como analisis-ia.html: mapa propio, estilos propios, service
     worker propio. Comparte con index.html exactamente dos archivos, los dos de
     solo lectura: js/00-config.js (dónde está el motor) y js/71-iconos-urbis.js
     (el trazo de los iconos). Nada de js/05, js/12 ni js/20; nada del Apps
     Script; nada del almacenamiento de los reportes. Lo que se ve acá sale de
     api.urbispro.city/vt/* y de ningún otro sitio. -->
<html lang="es">
<head>
  <title>Visión Territorial · URBIS</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#060D1A" />
  <meta name="color-scheme" content="dark light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Visión Territorial" />
  <link rel="manifest" href="manifest-gobierno.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/gobierno/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/gobierno/icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/90-vt.css?v=860-la-manzana-cerrada" />
  <script>
    // Preferencias ANTES de pintar: tema, tamaño de letra y nivel de
    // rendimiento van en <html>, y si se aplicaran después se vería el salto.
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('urbis_vt_prefs_v1') || '{}');
        var h = document.documentElement;
        if (p.tema === 'oscuro' || p.tema === 'claro') h.setAttribute('data-theme', p.tema);
        if (p.escala) h.style.setProperty('--vt-escala', String(p.escala));
        var nivel = p.nivel;
        if (!nivel) {
          var reducir = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var nucleos = navigator.hardwareConcurrency || 4, memoria = navigator.deviceMemory || 4;
          nivel = reducir ? 'minimo' : (nucleos <= 4 || memoria <= 2) ? 'medio' : 'completo';
        }
        h.setAttribute('data-vt-nivel', nivel);
      } catch (e) {}
    })();
  </script>
</head>
<body>

<div id="vt-app">
  <header id="vt-top">
    <span class="vt-marca" aria-label="URBIS Visión Territorial">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/><path d="M12 3.5V1.5"/></svg>
    </span>
    <div class="vt-territorio"><b id="vt-top-nombre">Visión Territorial</b><small id="vt-top-sub">URBIS</small></div>
    <nav class="vt-desktop-nav" aria-label="Secciones">
      <button type="button" class="vt-icobtn" data-vt-ir="tablero" title="Tablero (1)"></button>
      <button type="button" class="vt-icobtn" data-vt-ir="mapa" title="Mapa (2)"></button>
      <button type="button" class="vt-icobtn" data-vt-ir="propuestas" title="Propuestas (3)"></button>
    </nav>
    <button type="button" class="vt-icobtn" id="vt-btn-ayuda" aria-label="Cómo leer esta pantalla"></button>
    <button type="button" class="vt-icobtn" id="vt-btn-ajustes" aria-label="Ajustes"></button>
    <button type="button" class="vt-avatar" id="vt-avatar" aria-label="Sesión">—</button>
  </header>

  <main id="vt-main">
    <section class="vt-pantalla" id="vt-acceso" data-vt-pantalla="acceso"></section>
    <section class="vt-pantalla" id="vt-tablero" data-vt-pantalla="tablero" aria-labelledby="vt-tablero-h"></section>
    <section class="vt-pantalla vt-pantalla-mapa" id="vt-mapa-pantalla" data-vt-pantalla="mapa">
      <div id="vt-mapa-wrap">
        <div id="vt-mapa" role="region" aria-label="Mapa del territorio"></div>
        <aside class="vt-hoja" id="vt-hoja" data-abierta="0" aria-label="Detalle del mapa">
          <div class="vt-hoja-asa" id="vt-hoja-asa"><span></span></div>
          <div class="vt-hoja-cuerpo" id="vt-hoja-cuerpo"></div>
        </aside>
      </div>
      <div class="vt-mapa-controles">
        <select class="vt-select" id="vt-sel-tipo" aria-label="Tipo de equipamiento"></select>
        <button type="button" class="vt-icobtn" id="vt-btn-lista" aria-pressed="false" aria-label="Ver como lista"></button>
      </div>
      <div class="vt-leyenda" id="vt-leyenda" data-plegada="1"></div>
      <button type="button" id="vt-fab-evaluar" aria-pressed="false"><span>Evaluar idea</span></button>
      <div id="vt-mapa-lista" hidden></div>
    </section>
    <section class="vt-pantalla" id="vt-propuestas" data-vt-pantalla="propuestas"></section>
    <section class="vt-pantalla" id="vt-propuesta" data-vt-pantalla="propuesta"></section>
  </main>

  <nav id="vt-nav" aria-label="Secciones">
    <button type="button" data-vt-ir="tablero"><span class="ico"></span>Tablero</button>
    <button type="button" data-vt-ir="mapa"><span class="ico"></span>Mapa</button>
    <button type="button" data-vt-ir="propuestas"><span class="ico"></span>Propuestas</button>
  </nav>
</div>

<div id="vt-toast" role="status" aria-live="polite"></div>
<div id="vt-actualizacion" hidden><span>Hay una versión nueva de Visión Territorial.</span><button type="button" class="vt-btn primario" id="vt-act-ahora">Recargar ahora</button><button type="button" class="vt-btn sutil" id="vt-act-despues">Después</button></div>
<div id="vt-modal" hidden role="dialog" aria-modal="true"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/00-config.js?v=860-la-manzana-cerrada"></script>
<script src="js/71-iconos-urbis.js?v=860-la-manzana-cerrada"></script>
<script src="js/90-vt-app.js?v=860-la-manzana-cerrada"></script>
</body>
</html>
