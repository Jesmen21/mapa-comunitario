<!-- La tarjeta del enlace (v1136). WhatsApp, Telegram, Slack y X la arman con
     estas etiquetas: sin og:image no sale miniatura, y sin og:description se
     muestra el <title> solo. Las URL van ABSOLUTAS porque quien lee la tarjeta
     no es el navegador que está en la página: es un servidor que trae el HTML
     suelto y no puede resolver una ruta relativa.
     Y la descripción solo afirma hecho, fecha, fuente y estado: una tarjeta se
     reenvía sin el sitio detrás, así que es la única superficie del módulo que
     viaja sola y no puede imputarle nada a nadie. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="URBIS">
<meta property="og:locale" content="es_CO">
<meta property="og:title" content="URBIS_CO">
<meta property="og:description" content="Entrada de la aplicación URBIS_CO. Redirige al mapa comunitario de urbispro.city.">
<meta property="og:url" content="https://urbispro.city/reportes.html">
<meta property="og:image" content="https://urbispro.city/assets/og/og-seguimiento.png">
<meta property="og:image:width" content="1200">

<meta property="og:image:alt" content="Tarjeta de URBIS: el nombre del módulo y el peldaño que hoy publica la ficha, sobre el fondo marfil del sitio.">
<meta name="twitter:card" content="summary_large_image">

<link rel="apple-touch-icon" href="assets/icons/reportes/icon-180.png">
<!--
  Esta página existe por una sola razón: el APK de URBIS_CO (city.urbispro.reportes)
  se firmó con /reportes.html como dirección de arranque, y esa dirección va
  grabada dentro del paquete. Si la página desapareciera, la app instalada
  abriría un 404.

  Lo que abre es la aplicación de verdad —index.html, la misma que la web—.
  Aquí hubo una carcasa ligera con su propia barra y sus propios botones; se
  retiró porque la interfaz la diseñó el dueño una vez, para la web, y el APK
  tiene que enseñar esa y no otra. A los módulos —social, seguimiento
  presidencial— se entra por Inicio, como siempre.

  Se conservan el manifiesto y el icono amarillo para que PWABuilder pueda
  volver a empaquetar desde esta misma dirección.
-->
<script>
  // La entrada del APK lleva el modo: index.html?app=ciudadano. Con él,
  // js/70-modo-app.js quita del inicio y bloquea lo que no es de esta app.
  var q = location.search ? location.search + '&app=ciudadano' : '?app=ciudadano';
  location.replace('index.html' + q + location.hash);
</script>
<!-- El meta refresh va SOLO sin JavaScript. Con los dos activos son dos
     navegaciones compitiendo por la misma página, y el navegador aborta la
     primera a mitad de camino. -->
<noscript><meta http-equiv="refresh" content="0; url=index.html?app=ciudadano"></noscript>
<style>html,body{margin:0;height:100%;background:#FABD0A}</style>
</head>
